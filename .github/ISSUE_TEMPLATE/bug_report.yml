name: Bug report
description: Report a reproducible defect in the app or documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve Six Refuses."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the defect and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Change...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Firefox 128 on macOS, iPhone Safari, etc."
  - type: dropdown
    id: impact
    attributes:
      label: Area
      options:
        - Scientific accuracy
        - Interaction behavior
        - Accessibility
        - Responsive layout
        - Documentation
        - Build or development setup
    validations:
      required: true
